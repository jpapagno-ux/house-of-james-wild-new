# External links audit (James, 13 Nov 2026): lists every outbound link on the live site and commits the list.
name: External links audit
on:
  workflow_dispatch:
  push:
    branches: [link-freeze]
    paths: [scripts/audit/external-links.mjs]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/audit/external-links.mjs
      - run: |
          git config user.name "jwco-bot"
          git config user.email "jwco-bot@users.noreply.github.com"
          git add scripts/audit/external-links.json
          git commit -m "External links audit" && git push
