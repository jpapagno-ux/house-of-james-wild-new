# Aqua Expeditions partner data. "fetch" (by hand, or a push changing the fetch script) pulls the public
# trips, ships, departures, day-by-day itineraries, page photographs and films Aqua's own site loads and
# commits them as scripts/data/aqua/raw.json for scripts/partners/aqua-build.mjs. "photos" (a push changing
# scripts/data/aqua/photos.json) uploads the listed photographs into Cloudinary with the CLOUDINARY_URL
# secret and commits scripts/data/aqua/photos-done.json. Both commit to the branch they ran on.
name: Aqua Expeditions fetch

on:
  workflow_dispatch:
  push:
    paths: [scripts/partners/aqua-contact.mjs, scripts/partners/aqua-fetch.mjs, scripts/partners/aqua-photos.mjs, scripts/data/aqua/photos.json, .github/workflows/aqua-fetch.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch
        if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[photos]') && !contains(github.event.head_commit.message, '[contact]')
        run: node scripts/partners/aqua-fetch.mjs
      - name: Photographs
        if: contains(github.event.head_commit.message, '[photos]')
        env:
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
        run: node scripts/partners/aqua-photos.mjs
      - name: Contact sheets
        if: contains(github.event.head_commit.message, '[contact]')
        run: node scripts/partners/aqua-contact.mjs
      - name: Commit
        run: |
          git config user.name "jwco-bot"
          git config user.email "jwco-bot@users.noreply.github.com"
          git add scripts/data/aqua/
          git diff --cached --quiet || git commit -m "Aqua Expeditions data, $(date -u +%F)"
          git push
