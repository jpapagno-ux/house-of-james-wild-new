name: Contact sheets (temporary)
on:
  push:
    branches: [tmp/contact-sheets-b2]
    paths: [".contact/list2.tsv"]
permissions:
  contents: write
jobs:
  sheets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sheets
        run: |
          pip install -q pillow pillow-avif-plugin
          python3 .contact/build.py || true
      - name: Commit
        run: |
          git config user.name "contact-sheets"; git config user.email "actions@github.com"
          git add .contact/sheets && git commit -m "Contact sheets" && git push
