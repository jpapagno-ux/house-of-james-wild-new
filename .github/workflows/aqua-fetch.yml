# Aqua Expeditions partner data: fetches the public trips, ships, departures and day-by-day
# itineraries Aqua's own site loads, and keeps them as a run artifact (scripts/data/aqua/raw.json)
# for scripts/partners/aqua-build.mjs, and commits it to the branch it ran on. Run by hand, or on a
# push that changes the fetch script.
name: Aqua Expeditions fetch

on:
  workflow_dispatch:
  push:
    paths: [scripts/partners/aqua-fetch.mjs, .github/workflows/aqua-fetch.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/partners/aqua-fetch.mjs
      - name: Commit the raw data
        run: |
          git config user.name "jwco-bot"
          git config user.email "jwco-bot@users.noreply.github.com"
          git add scripts/data/aqua/raw.json
          git diff --cached --quiet || git commit -m "Aqua Expeditions raw data, $(date -u +%F)"
          git push
