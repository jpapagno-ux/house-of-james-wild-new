name: Contact sheets (temporary)
on:
  push:
    branches: [tmp/contact-sheets-africa2]
    paths: [".contact/list2.tsv", ".contact/pages.tsv"]
permissions:
  contents: write
jobs:
  sheets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sheets
        run: |
          pip install -q pillow pillow-avif-plugin
          if [ -s .contact/pages.tsv ]; then python3 .contact/crawl.py || true; else python3 .contact/build.py || true; fi
      - name: Commit
        run: |
          git config user.name "contact-sheets"; git config user.email "actions@github.com"
          git add .contact && git commit -m "Contact sheets" && git push
